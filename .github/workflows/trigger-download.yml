name: "触发下载"

'on':
  workflow_dispatch:
    inputs:
      extract:
        description: '是否解压 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          EXTRACT: ${{ github.event.inputs.extract }}
        run: python python/download.py

      - name: Upload to GitHub Release (latest)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Build"
          files: zip/tvboxqq.zip
          body: "自动构建于 ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add zip/
          git diff --cached --quiet || (git commit -m "chore: 手动下载更新 $(date +'%Y-%m-%d %H:%M')" && git push)
