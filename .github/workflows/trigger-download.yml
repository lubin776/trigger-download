name: "触发下载推送releases"

on:
  workflow_dispatch:
    inputs:
      extract:
        description: '是否解压 (true/false)'
        required: false
        default: 'false'
      jobs:
        description: '下载任务，格式: 文件名|地址;文件名|地址'
        required: false
        default: 'jiekoudaquan1.0.2.apk|https://mpimg.cn/down.php/fc3ec6736f40710f5fdefd3ae34ec9a1.apk'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run downloader
        env:
          EXTRACT: ${{ github.event.inputs.extract }}
          SAVE_DIR: zip
          # 多个任务用分号 ; 分隔，格式 文件名|地址
          JOBS: ${{ github.event.inputs.jobs }}
        run: python python/download.py

      - name: Delete old release (latest)
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release (latest)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Build"
          files: zip/*
          body: "自动构建于 ${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add zip/
          git diff --cached --quiet || (git commit -m "chore: 下载更新 $(date +'%Y-%m-%d %H:%M')" && git push)